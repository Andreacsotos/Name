<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          sans-serif;
        background: #f5f5f5;
        padding: 12px;
        color: #333;
      }

      .header {
        margin-bottom: 16px;
        border-bottom: 2px solid #007bff;
        padding-bottom: 10px;
      }

      .header h1 {
        font-size: 16px;
        font-weight: 600;
        color: #007bff;
      }

      .header p {
        font-size: 12px;
        color: #666;
        margin-top: 4px;
      }

      .section {
        margin-bottom: 16px;
        background: white;
        border-radius: 6px;
        padding: 12px;
        border: 1px solid #eee;
      }

      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
      }

      .section-title::before {
        content: "";
        width: 4px;
        height: 4px;
        background: #007bff;
        border-radius: 50%;
        margin-right: 6px;
      }

      .category-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }

      .tab {
        flex: 1;
        padding: 6px 8px;
        background: #f0f0f0;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
        text-align: center;
        transition: all 0.2s;
      }

      .tab:hover {
        background: #e8e8e8;
      }

      .tab.active {
        background: #007bff;
        color: white;
        border-color: #007bff;
      }

      .formats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        max-height: 200px;
        overflow-y: auto;
        margin-bottom: 10px;
      }

      .format-item {
        padding: 8px;
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 11px;
      }

      .format-item:hover {
        border-color: #007bff;
        background: #f0f8ff;
      }

      .format-item input[type="checkbox"] {
        margin-right: 4px;
      }

      .format-item label {
        cursor: pointer;
        display: flex;
        align-items: center;
      }

      .format-name {
        font-weight: 500;
        color: #333;
      }

      .format-size {
        font-size: 10px;
        color: #999;
        margin-left: 4px;
      }

      .custom-format {
        padding: 8px;
        background: #f9f9f9;
        border-radius: 4px;
        border: 1px solid #ddd;
      }

      .custom-format input {
        width: 100%;
        padding: 6px;
        margin-bottom: 6px;
        border: 1px solid #ddd;
        border-radius: 3px;
        font-size: 12px;
      }

      .input-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }

      .button-group {
        display: flex;
        gap: 6px;
      }

      button {
        flex: 1;
        padding: 8px 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        transition: all 0.2s;
      }

      button:hover {
        background: #0056b3;
      }

      button:active {
        transform: scale(0.98);
      }

      button.secondary {
        background: #6c757d;
      }

      button.secondary:hover {
        background: #545b62;
      }

      .action-buttons {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      #resizeBtn {
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        background: linear-gradient(135deg, #007bff, #0056b3);
      }

      #resizeBtn:hover {
        background: linear-gradient(135deg, #0056b3, #003d82);
      }

      .status {
        padding: 8px;
        border-radius: 4px;
        font-size: 11px;
        margin-top: 8px;
        display: none;
      }

      .status.success {
        display: block;
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .status.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .status.info {
        display: block;
        background: #d1ecf1;
        color: #0c5460;
        border: 1px solid #bee5eb;
      }

      .loading {
        display: none;
        text-align: center;
        padding: 12px;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .info-box {
        background: #e7f3ff;
        border-left: 3px solid #007bff;
        padding: 8px;
        margin-bottom: 12px;
        font-size: 11px;
        color: #004085;
        border-radius: 2px;
      }

      .complexity-badge {
        display: inline-block;
        padding: 2px 6px;
        background: #ffc107;
        color: white;
        border-radius: 2px;
        font-size: 9px;
        font-weight: 600;
        margin-left: 4px;
      }

      .complexity-badge.extreme {
        background: #dc3545;
      }

      .complexity-badge.high {
        background: #fd7e14;
      }

      .complexity-badge.low {
        background: #28a745;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🎨 Smart Size</h1>
      <p>Redimensiona inteligentemente tu diseño a múltiples formatos</p>
    </div>

    <div class="info-box">
      Selecciona un frame y elige los formatos en los que deseas adaptarlo
    </div>

    <!-- Sección de Categorías -->
    <div class="section">
      <div class="section-title">Categorías</div>
      <div class="category-tabs">
        <button class="tab active" data-category="all">Todos</button>
        <button class="tab" data-category="social">Social</button>
        <button class="tab" data-category="banner">Banner</button>
      </div>
    </div>

    <!-- Sección de Formatos -->
    <div class="section">
      <div class="section-title">Formatos Disponibles</div>
      <div class="formats-grid" id="formatsGrid"></div>

      <div class="button-group">
        <button id="selectAllBtn" class="secondary">Todos</button>
        <button id="deselectAllBtn" class="secondary">Ninguno</button>
      </div>
    </div>

    <!-- Sección de Formato Personalizado -->
    <div class="section">
      <div class="section-title">Formato Personalizado (Opcional)</div>
      <div class="custom-format">
        <input
          type="text"
          id="customName"
          placeholder="Nombre del formato"
          maxlength="30"
        />
        <div class="input-row">
          <input
            type="number"
            id="customWidth"
            placeholder="Ancho (px)"
            min="10"
            max="10000"
          />
          <input
            type="number"
            id="customHeight"
            placeholder="Alto (px)"
            min="10"
            max="10000"
          />
        </div>
        <button id="addCustomBtn" class="secondary">+ Añadir Formato</button>
      </div>
    </div>

    <!-- Sección de Acciones -->
    <div class="action-buttons">
      <button id="resizeBtn">🚀 Generar Variantes</button>
    </div>

    <!-- Estado -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Procesando...</p>
    </div>

    <div class="status" id="status"></div>

    <script>
      const plugin = {
        selectedFormats: new Set(),
        allFormats: [],

        init() {
          this.attachEventListeners();
          this.loadFormats();
        },

        attachEventListeners() {
          // Tabs de categorías
          document.querySelectorAll(".tab").forEach((tab) => {
            tab.addEventListener("click", (e) => {
              document.querySelectorAll(".tab").forEach((t) => {
                t.classList.remove("active");
              });
              e.target.classList.add("active");
              this.filterByCategory(e.target.dataset.category);
            });
          });

          // Seleccionar/deseleccionar todo
          document.getElementById("selectAllBtn").addEventListener("click", () => {
            document.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
              if (cb.offsetParent !== null) {
                // Solo si está visible
                cb.checked = true;
                plugin.selectedFormats.add(cb.value);
              }
            });
          });

          document
            .getElementById("deselectAllBtn")
            .addEventListener("click", () => {
              document.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
                cb.checked = false;
                plugin.selectedFormats.delete(cb.value);
              });
            });

          // Añadir formato personalizado
          document.getElementById("addCustomBtn").addEventListener("click", () => {
            this.addCustomFormat();
          });

          // Botón de resize
          document.getElementById("resizeBtn").addEventListener("click", () => {
            this.performResize();
          });
        },

        loadFormats() {
          parent.postMessage({ pluginMessage: { type: "GET_FORMATS" } }, "*");
        },

        displayFormats(formats) {
          this.allFormats = formats;
          this.renderFormats(formats);
        },

        renderFormats(formats) {
          const grid = document.getElementById("formatsGrid");
          grid.innerHTML = "";

          formats.forEach((format) => {
            const div = document.createElement("div");
            div.className = "format-item";

            let complexityBadge = "";
            if (format.complexity) {
              complexityBadge = `<span class="complexity-badge ${format.complexity}">${format.complexity}</span>`;
            }

            div.innerHTML = `
              <label>
                <input type="checkbox" value="${format.key}" />
                <span class="format-name">${format.name}</span>
                <span class="format-size">${format.width}×${format.height}</span>
                ${complexityBadge}
              </label>
            `;

            const checkbox = div.querySelector("input");
            checkbox.addEventListener("change", (e) => {
              if (e.target.checked) {
                plugin.selectedFormats.add(e.target.value);
              } else {
                plugin.selectedFormats.delete(e.target.value);
              }
            });

            grid.appendChild(div);
          });
        },

        filterByCategory(category) {
          if (category === "all") {
            this.renderFormats(this.allFormats);
          } else {
            const filtered = this.allFormats.filter(
              (f) => f.category === category
            );
            this.renderFormats(filtered);
          }
        },

        addCustomFormat() {
          const name = document.getElementById("customName").value;
          const width = parseInt(document.getElementById("customWidth").value);
          const height = parseInt(document.getElementById("customHeight").value);

          if (!name || !width || !height) {
            this.showStatus(
              "Por favor completa todos los campos",
              "error"
            );
            return;
          }

          parent.postMessage(
            {
              pluginMessage: {
                type: "CREATE_CUSTOM_FORMAT",
                name,
                width,
                height,
              },
            },
            "*"
          );

          // Limpiar campos
          document.getElementById("customName").value = "";
          document.getElementById("customWidth").value = "";
          document.getElementById("customHeight").value = "";
        },

        performResize() {
          if (this.selectedFormats.size === 0) {
            this.showStatus(
              "Por favor selecciona al menos un formato",
              "error"
            );
            return;
          }

          this.setLoading(true);

          parent.postMessage(
            {
              pluginMessage: {
                type: "ANALYZE_AND_RESIZE",
                selectedFormats: Array.from(this.selectedFormats),
              },
            },
            "*"
          );
        },

        showStatus(message, type) {
          const statusEl = document.getElementById("status");
          statusEl.textContent = message;
          statusEl.className = `status ${type}`;

          setTimeout(() => {
            statusEl.className = "status";
          }, 5000);
        },

        setLoading(loading) {
          document.getElementById("loading").style.display = loading
            ? "block"
            : "none";
          document.getElementById("resizeBtn").disabled = loading;
        },
      };

      // Escuchar mensajes del plugin
      onmessage = (event) => {
        const { type, formats, success, framesGenerated, message, errors } =
          event.data.pluginMessage || {};

        switch (type) {
          case "FORMATS_LIST":
            plugin.displayFormats(formats);
            break;

          case "RESIZE_COMPLETE":
            plugin.setLoading(false);
            if (success) {
              plugin.showStatus(
                `✅ ${framesGenerated.length} formato(s) generado(s) exitosamente`,
                "success"
              );
            } else {
              plugin.showStatus(`❌ Error: ${errors?.[0] || message}`, "error");
            }
            break;

          case "ERROR":
            plugin.setLoading(false);
            plugin.showStatus(`❌ ${message}`, "error");
            break;

          case "CUSTOM_FORMAT_CREATED":
            plugin.showStatus("✅ Formato personalizado añadido", "success");
            plugin.loadFormats();
            break;
        }
      };

      // Inicializar
      plugin.init();
    </script>
  </body>
</html>
